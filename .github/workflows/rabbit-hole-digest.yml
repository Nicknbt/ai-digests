name: Rabbit Hole Digest

on:
  schedule:
    - cron: '0 12 * * 5'   # Friday 12:00 UTC
  workflow_dispatch:        # Allow manual trigger

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Generate digest
        run: node src/digests/rabbit-hole.js
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_BASE_URL: ${{ secrets.OPENCODE_BASE_URL }}
          OPENCODE_MODEL: ${{ secrets.OPENCODE_MODEL }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

      - name: Commit archive
        run: |
          git config user.name "ai-digests-bot"
          git config user.email "bot@ai-digests.local"
          git add archives/
          if git diff --staged --quiet; then
            echo "No archive changes to commit"
          else
            git commit -m "auto: rabbit-hole digest archive [skip ci]"
            git push
          fi
